id = "fabrik"
name = "fabrik"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Run an AI-agent company in herdr: org chart, heartbeats, Plane + Obsidian."
platforms = ["linux", "macos"]

# Install dependencies and put the `fabrik` CLI on PATH (~/.local/bin/fabrik). Every command runs
# through bin/fabrik, which finds a Node.js >= 24 even when an older one comes first on herdr's PATH.
[[build]]
command = ["sh", "-c", "npm ci --omit=dev --no-audit --no-fund && sh bin/fabrik shim install"]

# herdr does not persist pane metadata across restarts: re-apply roles/models, then exit.
# The heartbeat itself runs under systemd (`fabrik service install`), because herdr does not
# supervise startup commands.
[[startup]]
command = ["sh", "bin/fabrik", "hook", "startup"]

[[actions]]
id = "status"
title = "fabrik: company status"
description = "Agents, queues and daemon state for this session's fabrik companies"
contexts = ["global", "workspace", "pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "fabrik", "--entrypoint", "status"]

[[actions]]
id = "wake"
title = "fabrik: wake this agent"
description = "Queue a heartbeat for the fabrik agent in the focused pane"
contexts = ["pane"]
command = ["sh", "bin/fabrik", "hook", "wake-focused"]

[[actions]]
id = "stop"
title = "fabrik: stop this agent"
description = "Interrupt the focused fabrik agent, pause it and keep its work queued"
contexts = ["pane"]
command = ["sh", "bin/fabrik", "hook", "stop-focused"]

[[panes]]
id = "status"
title = "fabrik status"
placement = "popup"
width = 72
height = 14
# Keep the popup open with the error when the command fails, instead of closing it at once.
command = ["sh", "-c", "sh bin/fabrik hook status-pane || { printf '\\nPress Enter to close. '; read -r _; }"]
